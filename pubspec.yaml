name: namer_app
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.1

environment:
  sdk: ^3.1.1

dependencies:
  flutter:
    sdk: flutter

  english_words: ^4.0.0
  provider: ^6.0.0
  flutter_riverpod: ^2.5.1
  spell_check_on_client: ^0.0.8
  scrabble_word_checker: ^0.0.8
  shared_preferences: ^2.3.1
  confetti: ^0.7.0
  http: ^1.2.2
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - lib_assests/scrabble.jpg
    - lib_assests/trade.png
    - lib_assests/words.txt
    - assets/words/word_of_the_day.json
    - lib_assests/letterBackground.png
    - assets/images/village_preview.png
    - assets/village/buildings/
    - assets/village/cards/
    - assets/village/buildings.json

  fonts:
    - family: LilitaOne
      fonts:
        - asset: assets/fonts/LilitaOne-Regular.ttf
    - family: Atkinson
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
